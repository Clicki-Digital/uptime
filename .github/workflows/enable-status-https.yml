name: Enable status HTTPS
on:
  workflow_dispatch:
  push:
    branches: [codex/enable-status-https]
    paths: [.github/workflows/enable-status-https.yml]
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update the repository website link
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PATCH "repos/$GH_REPO" -f homepage=https://status.getlucid.solutions --silent
      - name: Enable HTTPS enforcement for the configured Pages domain
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const url = `https://api.github.com/repos/${process.env.GH_REPO}/pages`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' };
          for (let attempt = 1; attempt <= 60; attempt++) {
            const response = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({ https_enforced: true }) });
            if (response.ok) {
              const statusResponse = await fetch(url, { headers });
              if (!statusResponse.ok) throw new Error(`Unable to confirm Pages settings: HTTP ${statusResponse.status}`);
              const status = await statusResponse.json();
              if (!status.https_enforced) throw new Error('GitHub has not enabled HTTPS enforcement');
              console.log(`HTTPS enforcement enabled for ${status.cname}.`);
              process.exit(0);
            }
            const result = await response.json();
            if (response.status !== 404 || !result.message?.includes('certificate has not yet been issued')) {
              throw new Error(`GitHub refused the change: HTTP ${response.status}: ${result.message}`);
            }
            console.log(`Certificate not issued yet; attempt ${attempt}/60. Retrying in 30 seconds.`);
            if (attempt < 60) await new Promise(resolve => setTimeout(resolve, 30000));
          }
          throw new Error('Certificate still pending after 30 minutes. HTTPS enforcement was not enabled.');
          JS
