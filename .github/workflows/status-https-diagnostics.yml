name: Diagnose status certificate
on:
  push:
    branches: [codex/status-https-diagnostics]
    paths: [.github/workflows/status-https-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages domain validation
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node --input-type=module <<'JS'
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          for (const path of ['pages/health', 'pages']) {
            const response = await fetch(`https://api.github.com/repos/Clicki-Digital/uptime/${path}`, { headers });
            console.log(path, response.status, JSON.stringify(await response.json()));
            if (!response.ok) throw new Error('Pages diagnostic failed');
          }
          JS
